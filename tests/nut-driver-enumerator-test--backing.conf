[realups]
    driver = usbhid-ups
    port = auto

[realups2]
    driver = usbhid-ups
    port = auto

[clone-1]
    driver = clone
    port = usbhid-ups-realups
    load.on = outlet.1.load.on
    load.off = outlet.1.load.off
    load.status = outlet.1.status

[clone-outlet-1]
    driver = clone-outlet
    port = usbhid-ups-realups
    prefix = outlet.1

[failover]
    driver = failover
    port = usbhid-ups-realups,usbhid-ups-realups2

[file]
    driver = dummy-ups
    port = example.dev
