<title id="bizarre-title">Power and communication can differ</title>
<desc id="bizarre-desc">Power: UPS 1 feeds Server only; UPS 2 feeds Client 1 and Client 2 only. Communication: the USB or serial links of both UPSes go to two drivers on Server, which also runs upsd. upsmon on Server runs as primary for UPS 1. upsmon on Client 1 and Client 2 monitors UPS 2 as secondary through upsd on Server over TCP.</desc>
