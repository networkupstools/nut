<title id="nut_layering-title">How NUT fits together</title>
<desc id="nut_layering-desc">A power device talks to a NUT driver using its own device protocol. The driver and upsd run on the same host and talk over local IPC (Unix domain sockets or Windows named pipes). upsd keeps a data cache and answers client requests. Clients on this or another host use the NUT network protocol over TCP, including over localhost: upsmon for shutdown, upsc and upslog to read and log, upsrw and upscmd for permitted changes.</desc>
