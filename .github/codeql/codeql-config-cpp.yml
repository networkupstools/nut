# CodeQL config for the C/C++ cells (build-mode: manual).
# With a manual build, paths-ignore only affects the file coverage numbers on
# the tool status page, not what gets analyzed: the workflow drops alerts in
# tests/ from the SARIF before uploading it (see sarif-filter.jq).
paths-ignore:
  - tests
# Style notes from security-and-quality, not defects: commented-out code,
# FIXME comments, and "if (p) free(p);" (guarded-free; free(NULL) is a
# no-op since C89, the guard is redundant but harmless). Together they
# made up most of the alerts.
query-filters:
  - exclude:
      id: cpp/commented-out-code
  - exclude:
      id: cpp/fixme-comment
  - exclude:
      id: cpp/guarded-free
  # Code-style metrics, not defects: case length, switch size, comment
  # density, partial enum initializers, and loop counters advanced inside
  # the body (NUT's hand-written parsers do "buf[++i]" on purpose).
  - exclude:
      id: cpp/long-switch
  - exclude:
      id: cpp/trivial-switch
  - exclude:
      id: cpp/poorly-documented-function
  - exclude:
      id: cpp/irregular-enum-init
  - exclude:
      id: cpp/loop-variable-changed
  # Replaced by nut/cpp/constant-comparison below, which skips portable
  # range checks against type limits (e.g. "(uintmax_t)ret > SIZE_MAX").
  - exclude:
      id: cpp/constant-comparison
queries:
  - uses: ./.github/codeql/nut-cpp-queries
