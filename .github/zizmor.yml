# Configuration of zizmor, the GitHub Actions static analysis tool used by
# the "GHA-06: zizmor" workflow (.github/workflows/06-zizmor.yml), see
# https://docs.zizmor.sh/configuration/
# This records deliberate choices of this repository, so that the check
# only fails for new problems. Please explain the reason for each entry.

rules:
  unpinned-uses:
    config:
      policies:
        # Actions are referenced by tags (e.g. "@v7") in this repository,
        # and updated by Dependabot. Pinning them to commit SHAs would be
        # a separate decision for all workflows.
        "*": ref-pin

  dangerous-triggers:
    ignore:
      # Uses pull_request_target to comment on PRs and set statuses with
      # write permissions; the untrusted PR code only runs in its "Worker"
      # job, with read-only permissions (see comments there).
      - 01-make-dist.yml
