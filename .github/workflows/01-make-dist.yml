# Adapted from NUT codeql.yml with inspiration taken from
# https://javahelps.com/manage-github-artifact-storage-quota
# regarding uploads of artifacts and clearing the way for them.
#
# This workflow is triggered on pushes to a repository (PRs,
# branch increments, or tags). It has higher permissions to
# perform management of comments and checks, and launches a
# separate "Worker" workflow for tarball generation touching
# possibly untrusted code base.
#
# See also:
#   https://github.com/actions/upload-artifact
#   https://docs.github.com/en/actions/reference/workflows-and-actions/variables
#   https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: "GHA-01: Tarballs"

on:
  push:
    branches: [ "master", "FTY", "fightwarn", "FTY-obs" ]
    tags:
      - v*
  pull_request_target:
    # The branches below must be a subset of the branches above
    # Note that for PRs this runs the copy of workflow in the
    # target branch (and only then gets some of the permissions
    # listed below), and identification/naming of PR source vs.
    # a pushed branch (e.g. master updated by a PR merge) is
    # tricky.
    branches: [ "master", "FTY", "fightwarn", "FTY-obs" ]
  schedule:
    - cron: '15 12 * * 0'
  workflow_dispatch:
    # Allow manually running the action, e.g. if disabled after some quietness in the source

permissions:
  statuses: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  arrange-dist-tarballs:
    name: "Arrange making Dist and Docs Tarballs, see workflow page for links"
    runs-on: ubuntu-latest

    steps:

    # Name the artifact by PR number, or by branch/tag name (with characters
    # that are not valid in artifact names, like "/", replaced by "_").
    # See also examples in https://github.com/dhimmel/dump-actions-context/
    # Values are passed via env, since a PR branch name is author-controlled.
    - name: Define Artifact Name
      id: set-artifact-name
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ -n "${PR_NUMBER}" ] ; then
            NAME="PR-${PR_NUMBER}"
        else
            NAME="${HEAD_REF:-${REF_NAME}}"
        fi
        NAME="`printf '%s' "${NAME}" | tr -c 'A-Za-z0-9._+-' '_'`"
        echo "ref_name=${NAME}" >> "$GITHUB_OUTPUT"
        echo "artifact_name=NUT-tarballs-${NAME}" >> "$GITHUB_OUTPUT"

    - name: Debug PR/branch identification
      env:
        github_event_pull_request_number: ${{ github.event.pull_request.number }}
        PR_ref_short: ${{ format('PR-{0}', github.event.pull_request.number) }}
        github_head_ref: ${{ github.head_ref }}
        github_ref: ${{ github.ref }}
        github_ref_name: ${{ github.ref_name }}
      run: |
        echo "steps.set-artifact-name.outputs.ref_name='${{ steps.set-artifact-name.outputs.ref_name }}'" || true
        echo "github.event.pull_request.number='${github_event_pull_request_number}'" || true
        echo "format('PR-{0}', github.event.pull_request.number)='${PR_ref_short}'" || true
        echo "github.head_ref='${github_head_ref}'" || true
        echo "github.ref='${github_ref}'" || true
        echo "github.ref_name='${github_ref_name}'" || true

    # One PR comment (found by a hidden marker) is posted here, and updated
    # with the tarball link or failure details at the end. Comments posted
    # earlier by thollander/actions-comment-pull-request are taken over.
    # Values are passed via env, not expanded into the script code.
    - name: "GHA-01: Create/Update new GH PR comment for future link"
      if: github.event.pull_request.number > 0
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        script: |
          const body = `Preparing a ZIP file with standard source tarball and another tarball with pre-built docs for commit ${process.env.COMMIT_REF} ...`;
          const marker = '<!-- GHA-01:tarball-url -->';
          const legacyMarker = '<!-- thollander/actions-comment-pull-request "tarball-url" -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const fullBody = `${body}\n\n${marker}`;
          const comments = await github.paginate(github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 });
          const old = comments.find(c => c.user && c.user.login === 'github-actions[bot]'
            && (c.body.includes(marker) || c.body.includes(legacyMarker)));
          if (old) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body: fullBody });
            console.log(`Updated comment ${old.id}`);
          } else {
            const res = await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            console.log(`Created comment ${res.data.id}`);
          }

    # We do not necessarily trust any code that comes from the PR branch
    # (nor whatever is produced by scripts and tools running there),
    # so we run that in a separate sandbox and just publish a link to
    # the results later.
    - name: Launch Build Worker
      id: launch_worker
      uses: benc-uk/workflow-dispatch@v1
      with:
        workflow: "GHA-01: Tarballs Build Worker"
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.event.pull_request.number > 0 && github.event.pull_request.base.ref || github.base_ref || github.head_ref || github.ref_name }}
        inputs: '{ "ref": "${{ github.event.pull_request.number > 0 && github.event.pull_request.head.sha || github.sha }}", "artifact_name": "${{ steps.set-artifact-name.outputs.artifact_name }}" }'
        wait-timeout-seconds: 3600
        wait-for-completion: true
        sync-status: true

    # The artifact was already uploaded by the "Worker" job.
    # We need to find the artifact URL and report it below.
    - name: Get Artifact URL
      id: get_artifact_url
      uses: actions/github-script@v9
      with:
          script: |
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              const artifactName = '${{ steps.set-artifact-name.outputs.artifact_name }}';
              // Find the most recent artifact with this name
              const artifacts = res.data.artifacts
                .filter(a => a.name === artifactName)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (artifacts.length > 0) {
                const artifact = artifacts[0];
                var workflowRunId = artifact.workflow_run_id || ${{ steps.launch_worker.outputs.runId }};
                core.setOutput('artifact_url', `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${workflowRunId}/artifacts/${artifact.id}`);
                core.setOutput('real_artifact_url', `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${workflowRunId}/artifacts/${artifact.id}`);
                core.setOutput('artifact_id', `${artifact.id}`);
                console.log(`Detected newest artifact ${artifact.id} from workflow run ${workflowRunId}`);
              } else {
                core.setFailed(`Artifact ${artifactName} not found`);
              }

    # Inspired by https://javahelps.com/manage-github-artifact-storage-quota
    # This is the part which needs "actions: write" permission.
    # Note that the code below wipes everything matched by the filter!
    # We may want another script block (after this cleanup of obsolete data)
    # to iterate clearing the way build by build until there's X MB available
    # (at least 12MB as of Nov 2025).
    - if: env.GITHUB_REF_TYPE != 'tag' && steps.set-artifact-name.outputs.ref_name != 'master'
      name: Delete Old Artifacts for this feature branch/PR
      uses: actions/github-script@v9
      id: delete_old_artifact_for_pr
      continue-on-error: true
      with:
        script: |
          const res = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
          })

          const artifact_id = '${{ steps.get_artifact_url.outputs.artifact_id }}';

          res.data.artifacts
            .filter(({ name }) => name === '${{ steps.set-artifact-name.outputs.artifact_name }}')
            .forEach(({ id }) => {
              if (id == artifact_id) return;
              console.log(`Deleting artifact ${id}`);
              github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: id,
              })
            })

    - name: "GHA-01: Create/update new GH PR comment with link"
      if: ${{ !cancelled() && github.event.pull_request.number > 0 }}
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ARTIFACT_NAME: "${{ steps.set-artifact-name.outputs.artifact_name }}.zip"
        ARTIFACT_URL: ${{ steps.get_artifact_url.outputs.real_artifact_url }}
        COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        WORKER_OUTCOME: ${{ steps.launch_worker.outcome }}
        WORKER_RUN_ID: ${{ steps.launch_worker.outputs.runId }}
      with:
        script: |
          const e = process.env;
          const server = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
          const runUrl = e.WORKER_RUN_ID
            ? `${server}/actions/runs/${e.WORKER_RUN_ID}`
            : `${server}/actions/runs/${context.runId}`;
          let body;
          if (e.ARTIFACT_URL) {
            body = `A ZIP file with standard source tarball and another tarball with pre-built docs for commit ${e.COMMIT_REF} is temporarily available: [${e.ARTIFACT_NAME}](${e.ARTIFACT_URL}).`;
            if (e.WORKER_OUTCOME !== 'success') {
              body += `\n\n:warning: Some checks in the [tarball build worker run](${runUrl}) failed.`;
            }
          } else {
            body = `:x: Could not prepare the tarballs for commit ${e.COMMIT_REF}, see the [tarball build worker run](${runUrl}).`;
          }
          const marker = '<!-- GHA-01:tarball-url -->';
          const legacyMarker = '<!-- thollander/actions-comment-pull-request "tarball-url" -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const fullBody = `${body}\n\n${marker}`;
          const comments = await github.paginate(github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 });
          const old = comments.find(c => c.user && c.user.login === 'github-actions[bot]'
            && (c.body.includes(marker) || c.body.includes(legacyMarker)));
          if (old) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body: fullBody });
            console.log(`Updated comment ${old.id}`);
          } else {
            const res = await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            console.log(`Created comment ${res.data.id}`);
          }

    # Report the link in this run's job summary, and as a commit status:
    # unlike check runs created with GITHUB_TOKEN (whose "details_url" is
    # ignored), a status "target_url" is honored, so "Details" in the PR
    # checks list leads to the artifact download right away.
    - name: "GHA-01: Report tarball link in summary and commit status"
      if: always()
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ARTIFACT_NAME: "${{ steps.set-artifact-name.outputs.artifact_name }}.zip"
        ARTIFACT_URL: ${{ steps.get_artifact_url.outputs.real_artifact_url }}
        COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        WORKER_OUTCOME: ${{ steps.launch_worker.outcome }}
        WORKER_RUN_ID: ${{ steps.launch_worker.outputs.runId }}
      with:
        script: |
          const e = process.env;
          const server = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
          const runUrl = e.WORKER_RUN_ID
            ? `${server}/actions/runs/${e.WORKER_RUN_ID}`
            : `${server}/actions/runs/${context.runId}`;
          await core.summary
            .addHeading('Dist and Docs tarballs', 3)
            .addTable([
              [{ data: 'Item', header: true }, { data: 'Value', header: true }],
              ['Commit', e.COMMIT_REF],
              ['Tarballs', e.ARTIFACT_URL ? `<a href="${e.ARTIFACT_URL}">${e.ARTIFACT_NAME}</a>` : 'not available'],
              ['Worker run', `<a href="${runUrl}">${e.WORKER_OUTCOME || 'not started'}</a>`],
            ])
            .write();
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: e.COMMIT_REF,
            context: 'GHA-01: Tarballs / download link',
            state: e.ARTIFACT_URL ? 'success' : 'failure',
            target_url: e.ARTIFACT_URL || runUrl,
            description: e.ARTIFACT_URL
              ? `Dist and Docs tarballs for ${e.COMMIT_REF.substring(0, 9)}`
              : `No tarballs for ${e.COMMIT_REF.substring(0, 9)}, see the worker run`,
          });
