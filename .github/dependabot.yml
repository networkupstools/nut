# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/keeping-your-actions-up-to-date-with-dependabot

version: 2
updates:
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Only propose action versions published at least a week ago, so that a
    # compromised release is more likely to be found and pulled before we
    # pick it up (for SHA-pinned actions as well as for GitHub's own ones,
    # which are referenced by tags, see .github/zizmor.yml)
    cooldown:
      default-days: 7
